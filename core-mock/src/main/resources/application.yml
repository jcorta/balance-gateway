spring:
  application:
    name: core-mock
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  threads:
    virtual:
      enabled: true

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
