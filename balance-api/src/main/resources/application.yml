spring:
  application:
    name: balance-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
