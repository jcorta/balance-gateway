spring:
  application:
    name: balance-api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true

server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

balance:
  core:
    base-url: http://localhost:8090
    connect-timeout: 250ms
    read-timeout: 700ms

---
spring:
  config:
    activate:
      on-profile: docker

balance:
  core:
    base-url: http://core-mock:8090
